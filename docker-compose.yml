# Local "legacy bank app" to automate against.
#
# ParaBank (Parasoft's demo banking app): Tomcat 10 + JDK 21 + HSQLDB, one
# container, no external dependencies. Chosen because it is a genuine
# server-rendered Java web app -- table layouts, .htm form posts, no test IDs,
# no SPA -- which is the "legacy web surface" the assignment describes, rather
# than a modern site with a clean DOM.
#
# Two services, same vendor product, different builds:
#   parabank    (image tag `baseline`)  -- tenant A, the surface we record on
#   parabank-b  (image tag `feature`)   -- tenant B, a drifted variant
# `baseline` and `latest` are the same digest upstream; `feature` is a distinct
# image. That gives us a free stand-in for "two institutions running the same
# core banking package at different versions" (assignment 3.7 / stretch goal).

# Project name comes from COMPOSE_PROJECT_NAME in .env rather than a top-level
# `name:` key, which older compose builds reject.
services:
  parabank:
    image: parasoft/parabank:baseline
    container_name: parabank
    restart: unless-stopped
    ports:
      - "${PARABANK_PORT:-8080}:8080"      # web UI + REST/SOAP services
      - "${PARABANK_JMS_PORT:-61616}:61616" # ActiveMQ, loan processor
      - "${PARABANK_DB_PORT:-9001}:9001"    # HSQLDB, for seeding/asserting out of band
    healthcheck:
      # LIVENESS ONLY -- Tomcat has deployed the webapp. It does NOT mean the
      # app is usable: ParaBank boots with no database schema and serves 200s
      # regardless. `interfaceai env reset` is the readiness gate and blocks on
      # interfaceai.parabank.is_seeded().
      #
      # ⛔ Was `curl || wget`. NEITHER IS IN THE IMAGE on amd64 -- every probe
      # exited 127 and the container sat `unhealthy` forever while the app
      # served 200s, so `docker compose up -d --wait` could never return. The
      # repo recorded "the image ships /usr/bin/curl" as verified; that was
      # measured on arm64, and `parasoft/parabank` is multi-arch with different
      # package sets. bash is present on amd64 (measured) and is a base Ubuntu
      # package rather than an added one, which is why it is the safer bet --
      # but arm64 has NOT been re-measured since this changed.
      #
      # Asks for the webapp specifically, not just the port: a bare TCP connect
      # passes as soon as Tomcat listens, which is before the war deploys.
      # Verified both directions -- /parabank/index.htm exits 0, a path Tomcat
      # does not serve exits 1.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /parabank/index.htm HTTP/1.0\r\n\r\n' >&3 &&
          head -1 <&3 | grep -qE 'HTTP/1\.[01] (200|302)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s   # Tomcat cold start + webapp deploy

  # The agent itself, so the RENDERING STACK is pinned rather than the host's.
  # See Dockerfile and docs/issues/0012 -- a template PNG rasterised by Linux
  # Chromium scored 0.6889 against macOS Chromium, below the 0.95 threshold,
  # on the first control of the first screen.
  #
  # ⭐ `network_mode: service:parabank` IS THE WHOLE TRICK, and it is why this
  # needs no config changes at all. The agent shares parabank's network
  # namespace, so `localhost:8080` inside here IS the bank -- which is exactly
  # what every committed artifact's `target.base_url`, every control map and
  # the origin allowlist already say. Putting the agent on a shared bridge
  # instead would mean rewriting all three to `http://parabank:8080`, and
  # retargeting artifacts for a networking detail is how a portability
  # mechanism gets used to paper over plumbing.
  #
  # ⛔ THIS SAID TENANT B WAS UNREACHABLE IN HERE. It is not, and the claim was
  # reasoned rather than measured. The namespace is still on the compose
  # bridge, so service DNS works -- what is absent is the HOST PORT MAPPING:
  #
  #   localhost:8080    HTTP/1.1 200     tenant A, same address as the host
  #   parabank-b:8080   HTTP/1.1 200     tenant B, by service name
  #   localhost:8081    UNREACHABLE      a host mapping, correctly absent
  #
  # So both tenants work; tenant B just has a different address, which is what
  # `tenant_configs/bank_b.docker.yaml` carries. Tenant A needs no variant.
  # The offline suite, and it proves its own claim by construction: NO
  # `network_mode`, NO `depends_on`. If anything in here needed ParaBank it
  # would fail, which is a stronger statement than the `live` marker -- that
  # is a label someone has to remember to apply, and three tests were wearing
  # the wrong one until the containers were paused on 2026-10-01.
  tests:
    image: interfaceai-agent
    build: .
    profiles: ["agent"]
    entrypoint: ["pytest"]
    command: ["-q", "-m", "not live"]
    volumes:
      - .:/app

  agent:
    build: .
    image: interfaceai-agent
    profiles: ["agent"]
    network_mode: "service:parabank"
    depends_on:
      parabank:
        condition: service_healthy
    env_file:
      - .env
      - .secret
    environment:
      # ⚠️ THE ALLOWLIST IS NOT THE SAME IN HERE, and it refused before it was
      # told. `.env` lists the HOST origins; from inside, tenant A is still
      # `localhost:8080` (shared namespace) but tenant B is `parabank-b:8080`,
      # and the first attempt died on
      #
      #   NotAllowedError: navigation to 'http://parabank-b:8080/...' is
      #   outside the allowlist ('http://localhost:8080','http://localhost:8081')
      #
      # which is the §3.4 guardrail working. Widened to the two origins that
      # exist in here, NOT to a wildcard: `localhost:8081` is deliberately
      # absent because nothing serves it inside this namespace.
      INTERFACEAI_ALLOWED_ORIGINS: http://localhost:8080,http://parabank-b:8080
    volumes:
      # Artifacts, control maps and evidence land on the HOST, not inside a
      # layer that disappears. /opt/venv is outside /app so this cannot
      # shadow the image's environment -- see the Dockerfile.
      - .:/app
    stdin_open: true    # the `--operator` handoff reads real stdin
    tty: true

  parabank-b:
    image: parasoft/parabank:feature
    container_name: parabank-b
    profiles: ["tenant-b"]
    restart: unless-stopped
    ports:
      - "${PARABANK_B_PORT:-8081}:8080"
      - "${PARABANK_B_JMS_PORT:-61617}:61616"
      - "${PARABANK_B_DB_PORT:-9002}:9001"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8080 &&
          printf 'GET /parabank/index.htm HTTP/1.0\r\n\r\n' >&3 &&
          head -1 <&3 | grep -qE 'HTTP/1\.[01] (200|302)'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

# No volumes on purpose. ParaBank's HSQLDB is in-container, so `docker compose
# down` is a full factory reset and every run starts from the same seed data --
# which is what makes replay determinism measurable rather than aspirational.
